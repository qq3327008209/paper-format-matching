# ============================================================
# 示例规则文件：本科毕业论文格式规范（简化版）
# 演示本引擎支持的主要 op 类型：eq / in / before / count_min / exists
# ============================================================
schema: contract-v1
domain: "本科毕业论文"
version: "1.0"

# ---- 段落分类 ----
segments:
  # 标题：文档第一个段落
  - id: title
    match: "index == 0"
    desc: "论文标题"

  # 摘要：第二个段落
  - id: abstract
    match: "index == 1"
    desc: "摘要"

  # 一级标题：汉字数字 + 顿号（一、二、三…）
  - id: h1
    match: "regex('^[一二三四五六七八九十]+、')"
    desc: "一级标题"

  # 二级标题：（一）（二）形式
  - id: h2
    match: "regex('^（[一二三四五六七八九十]+）')"
    desc: "二级标题"

  # 三级标题：阿拉伯数字 + 点（1. 2. 3.）
  - id: h3
    match: "regex('^\\d+\\.')"
    desc: "三级标题"

  # 正文：其余段落
  - id: body
    match: "else"
    desc: "正文"

# ---- 格式检查规则 ----
rules:

  # 标题：黑体 三号(16pt) 居中
  - segment: title
    field: font
    op: eq
    value: "黑体"
    msg: "论文标题字体应为黑体"
    format_action: "set_font"

  - segment: title
    field: size
    op: eq
    value: 16
    tol: 1.0
    msg: "论文标题字号应为三号(16pt)"

  - segment: title
    field: align
    op: eq
    value: center
    msg: "论文标题应居中"

  # 摘要：楷体 小四(12pt)
  - segment: abstract
    field: font
    op: eq
    value: "楷体"
    msg: "摘要字体应为楷体"

  - segment: abstract
    field: size
    op: eq
    value: 12
    tol: 1.0
    msg: "摘要字号应为小四(12pt)"

  # 一级标题：黑体 三号(16pt)
  - segment: h1
    field: font
    op: eq
    value: "黑体"
    msg: "一级标题字体应为黑体"
    format_action: "set_font"

  - segment: h1
    field: size
    op: eq
    value: 16
    tol: 1.0
    msg: "一级标题字号应为三号(16pt)"

  # 二级标题：楷体 小四(12pt)
  - segment: h2
    field: font
    op: eq
    value: "楷体"
    msg: "二级标题字体应为楷体"

  - segment: h2
    field: size
    op: eq
    value: 12
    tol: 1.0
    msg: "二级标题字号应为小四(12pt)"

  # 三级标题：仿宋 小四(12pt)
  - segment: h3
    field: font
    op: eq
    value: "仿宋"
    msg: "三级标题字体应为仿宋"

  - segment: h3
    field: size
    op: eq
    value: 12
    tol: 1.0
    msg: "三级标题字号应为小四(12pt)"

  # 正文：仿宋 小四(12pt) 两端对齐
  - segment: body
    field: font
    op: in
    value: ["仿宋", "仿宋_GB2312"]
    msg: "正文字体应为仿宋或仿宋_GB2312"
    format_action: "set_font"

  - segment: body
    field: size
    op: eq
    value: 12
    tol: 1.0
    msg: "正文字号应为小四(12pt)"

  # ---- 结构规则 ----

  # 必须有摘要（摘要段落存在）
  - segment: abstract
    op: exists
    msg: "缺少摘要章节"

  # 一级标题至少 2 个（要有两个以上章节）
  - segment: h1
    op: count_min
    value: 2
    msg: "一级标题至少应有2个（至少两章）"

  # 摘要必须在正文之前
  - segment: abstract
    op: before
    target: body
    msg: "摘要应位于正文之前"
