name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pywin32 nuitka ordered-set zstandard pytest pyinstaller

      - name: 运行测试
        run: python -m pytest tests/ -q

      - name: PyInstaller 构建 (实验阶段快速产物)
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name paper-format-matching-pyinstaller `
            --distpath dist-pyinstaller `
            --collect-all prompt_toolkit `
            --collect-all rich `
            --collect-all docx `
            --collect-all openai `
            --hidden-import win32com `
            --hidden-import pythoncom `
            gui.py
          New-Item -ItemType Directory -Force -Path dist-pyinstaller\package
          Copy-Item dist-pyinstaller\paper-format-matching-pyinstaller.exe dist-pyinstaller\package\
          Copy-Item -Recurse config dist-pyinstaller\package\config
          Compress-Archive -Path dist-pyinstaller\package\* -DestinationPath dist-pyinstaller\paper-format-matching-pyinstaller-windows.zip

      - name: 上传 PyInstaller 产物
        uses: actions/upload-artifact@v4
        with:
          name: paper-format-matching-pyinstaller-windows
          path: dist-pyinstaller/paper-format-matching-pyinstaller-windows.zip

      - name: Nuitka 编译 (Python → C → 原生 exe，发行版)
        env:
          NUITKA_CACHE_DIR: ${{ runner.temp }}\nuitka_cache
          NUITKA_ASSUME_YES_FOR_DOWNLOADS: yes
        run: |
          # --assume-yes-for-downloads: CI 非交互模式下自动同意下载 Dependency Walker
          # 以及其他 Nuitka 需要的工具
          # --enable-plugin=pyside6: GUI 入口依赖 Qt，插件负责收集 Qt 动态库与插件
          # --windows-console-mode=disable: GUI 程序不弹控制台窗口
          python -m nuitka `
            --enable-plugin=pyside6 `
            --standalone `
            --onefile `
            --output-dir=dist `
            --output-filename=paper-format-matching.exe `
            --include-package=engine `
            --include-package=format `
            --include-package=docx `
            --include-package=yaml `
            --include-package=lxml `
            --include-package=openai `
            --include-package=win32com `
            --include-package=pythoncom `
            --include-package=prompt_toolkit `
            --include-package=rich `
            --include-package-data=docx `
            --windows-console-mode=disable `
            --assume-yes-for-downloads `
            --remove-output `
            gui.py

      - name: 打包 exe + config
        run: |
          New-Item -ItemType Directory -Force -Path dist\package
          Copy-Item dist\paper-format-matching.exe dist\package\
          Copy-Item -Recurse config dist\package\config
          Compress-Archive -Path dist\package\* -DestinationPath dist\paper-format-matching-windows.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: paper-format-matching-windows
          path: dist/paper-format-matching-windows.zip

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/paper-format-matching-windows.zip
